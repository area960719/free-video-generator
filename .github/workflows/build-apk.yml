name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FreeVideoGenerator/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compilar APK
        working-directory: FreeVideoGenerator
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FreeVideoGenerator-apk
          path: FreeVideoGenerator/app/build/outputs/apk/debug/app-debug.apk